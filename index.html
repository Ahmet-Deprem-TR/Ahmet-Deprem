<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmet Deprem</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --bg-color: #f1f5f9; --text-color: #111827; --card-bg: #ffffff;
            --accent-red: #dc2626; --border-color: #cbd5e1; --input-bg: #ffffff;
            --latest-border: #fef08a;
        }
        body.dark-theme {
            --bg-color: #121212; --text-color: #e5e7eb; --card-bg: #1e1e1e;
            --border-color: #333333; --input-bg: #2a2a2a; --latest-border: #fef08a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; border-radius: 0 !important; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; transition: background 0.2s, color 0.2s; }
        header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .logo-img { height: 30px; object-fit: contain; display: block; }
        .top-controls { display: flex; gap: 5px; }
        .top-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 10px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .top-btn:active { background: var(--border-color); }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px; }
        .card h3 { font-size: 1rem; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .quake-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 5px; max-height: 400px; overflow-y: auto; }
        .quake-item { background: var(--input-bg); padding: 10px; font-size: 0.75rem; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 3px; }
        .settings-panel { display: flex; flex-direction: column; gap: 8px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; }
        .setting-row input, .setting-row select { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 4px 8px; font-size: 0.8rem; outline: none; }
        .test-btn { width: 100%; background: var(--accent-red); color: white; border: 1px solid #991b1b; padding: 10px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .test-btn:active { opacity: 0.8; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 15px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
        .modal-box h3 { font-size: 1rem; font-weight: bold; }
        .modal-box select { width: 100%; padding: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 0.85rem; }
        .modal-close-btn { background: var(--accent-red); color: white; border: none; padding: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <img src="Ahmetlogo.png" alt="Ahmet Deprem" class="logo-img" id="logoImg">
        <div class="top-controls">
            <button class="top-btn" onclick="openLocationModal()">Bölge Seç</button>
            <button class="top-btn" onclick="requestNotificationPermission()">Bildirim İzni</button>
        </div>
    </header>
    <div class="container">
        <div class="card">
            <h3>Son Depremler (Tüm Detaylar)</h3>
            <div class="quake-list" id="quakeList">
                <div class="quake-item">
                    <div style="font-weight: bold;">Veriler yükleniyor...</div>
                </div>
            </div>
            <p style="text-align: center; font-size: 0.7rem; color: #888; margin-top: 4px;">Bilgiler Canlı Veritabanından Alınmıştır</p>
        </div>
        <div class="card">
            <h3>Ayarlar</h3>
            <div class="settings-panel">
                <div class="setting-row">
                    <span>Bildirimler</span>
                    <input type="checkbox" id="notifToggle" onchange="saveSettings()" style="width: 18px; height: 18px; cursor: pointer;">
                </div>
                <div class="setting-row">
                    <span>Minimum Şiddet</span>
                    <input type="number" id="minMagnitude" value="3.0" step="0.1" min="0" max="10" onchange="saveSettings()" style="width: 60px; text-align: center;">
                </div>
                <div class="setting-row">
                    <span>Tema (Koyu Gri)</span>
                    <input type="checkbox" id="darkThemeToggle" onchange="toggleTheme()" style="width: 18px; height: 18px; cursor: pointer;">
                </div>
            </div>
        </div>
        <button class="test-btn" onclick="triggerTestNotification()">TEST UYARISI</button>
    </div>
    <div class="modal-overlay" id="locationModal">
        <div class="modal-box">
            <h3>Takip Edilecek Bölge</h3>
            <select id="regionSelect" onchange="saveLocation()">
                <option value="Tümü">Tüm Türkiye</option>
                <option value="Marmara">Marmara</option>
                <option value="Ege">Ege</option>
                <option value="Akdeniz">Akdeniz</option>
                <option value="İç Anadolu">İç Anadolu</option>
                <option value="Karadeniz">Karadeniz</option>
                <option value="Doğu Anadolu">Doğu Anadolu</option>
            </select>
            <button class="modal-close-btn" onclick="closeLocationModal()">Kapat</button>
        </div>
    </div>
    <script>
        const alertAudio = new Audio('dprauses.ogg');
        let lastEarthquakeId = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            registerServiceWorker();
            fetchEarthquakes();
            setInterval(fetchEarthquakes, 300000);
        });

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW hatası:', err));
            }
        }

        function toggleTheme() {
            const isDark = document.getElementById('darkThemeToggle').checked;
            document.body.classList.toggle('dark-theme', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const logoImg = document.getElementById('logoImg');
            logoImg.src = isDark ? 'Ahmetlogosiyah.png' : 'Ahmetlogo.png';
        }

        function openLocationModal() { document.getElementById('locationModal').classList.add('active'); }
        function closeLocationModal() { document.getElementById('locationModal').classList.remove('active'); }
        function saveLocation() { localStorage.setItem('user_region', document.getElementById('regionSelect').value); }

        function requestNotificationPermission() {
            if (!('Notification' in window)) return alert('Tarayıcınız bildirimleri desteklemiyor.');
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    document.getElementById('notifToggle').checked = true;
                    saveSettings();
                    alert('Bildirim izni verildi!');
                } else {
                    alert('Bildirim izni reddedildi.');
                }
            });
        }

        function saveSettings() {
            const isEnabled = document.getElementById('notifToggle').checked;
            localStorage.setItem('notif_enabled', isEnabled);
            localStorage.setItem('min_mag', document.getElementById('minMagnitude').value);
            if (isEnabled && Notification.permission !== 'granted') requestNotificationPermission();
        }

        function loadSettings() {
            const savedRegion = localStorage.getItem('user_region');
            if (savedRegion) document.getElementById('regionSelect').value = savedRegion;
            const isDark = localStorage.getItem('theme') === 'dark';
            if (isDark) {
                document.body.classList.add('dark-theme');
                document.getElementById('darkThemeToggle').checked = true;
                document.getElementById('logoImg').src = 'Ahmetlogosiyah.png';
            } else {
                document.getElementById('logoImg').src = 'Ahmetlogo.png';
            }
            document.getElementById('notifToggle').checked = ('Notification' in window && Notification.permission === 'granted');
            const savedMinMag = localStorage.getItem('min_mag');
            if (savedMinMag) document.getElementById('minMagnitude').value = savedMinMag;
        }

        async function fetchEarthquakes() {
            try {
                const response = await fetch('https://api.orhanaydogdu.com.tr/deprem/kandilli/live');
                const data = await response.json();
                if (data && data.result) {
                    const earthquakes = data.result;
                    const quakeListEl = document.getElementById('quakeList');
                    quakeListEl.innerHTML = '';
                    
                    earthquakes.forEach((eq, index) => {
                        const title = eq.title || '-';
                        const mag = eq.mag !== undefined ? eq.mag : '-';
                        const depth = eq.depth !== undefined ? `${eq.depth} km` : 'Bilgi Alınamadı';
                        const rawDate = eq.date || eq.time || eq.infotime || '-';
                        const lat = eq.lat !== undefined ? eq.lat : '-';
                        const lng = eq.lng !== undefined ? eq.lng : '-';
                        const provider = eq.provider || 'Kandilli';
                        const earthquakeId = eq.earthquake_id || '-';
                        const rev = (eq.rev !== undefined && eq.rev !== null && eq.rev !== '') ? eq.rev : 'Bilgi Alınamadı';

                        let timeOnly = 'Bilgi Alınamadı';
                        if (rawDate !== '-') {
                            timeOnly = rawDate.includes(' ') ? rawDate.split(' ')[1] : rawDate;
                        }

                        let magColor = '#111827';
                        if (mag >= 7.0) magColor = '#dc2626';
                        else if (mag >= 4.0) magColor = '#ca8a04';
                        
                        if (index === 0) {
                            if (lastEarthquakeId !== earthquakeId && lastEarthquakeId !== null) {
                                checkAndNotifyNewQuake(title, mag, timeOnly);
                            }
                            lastEarthquakeId = earthquakeId;
                        }

                        const item = document.createElement('div');
                        item.className = 'quake-item';
                        if (index === 0) item.style.border = '2px solid var(--latest-border)';
                        
                        item.innerHTML = `
                            <div style="display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid var(--border-color); padding-bottom: 3px;">
                                <span>${title} ${index === 0 ? '[YENİ]' : ''}</span>
                                <span style="color: ${magColor};">Büyüklük: ${mag}</span>
                            </div>
                            <div><strong>Saat:</strong> ${timeOnly} (Tarih: ${rawDate})</div>
                            <div><strong>Derinlik:</strong> ${depth}</div>
                            <div><strong>Konum:</strong> Enlem: ${lat}, Boylam: ${lng}</div>
                            <div><strong>Sağlayıcı / Kaynak:</strong> ${provider}</div>
                            <div><strong>Deprem ID:</strong> ${earthquakeId}</div>
                            <div><strong>Revizyon:</strong> ${rev}</div>
                        `;
                        quakeListEl.appendChild(item);
                    });
                }
            } catch (error) {
                console.log('Deprem verileri alınamadı:', error);
                document.getElementById('quakeList').innerHTML = '<div class="quake-item" style="color:#dc2626;">Veriler yüklenemedi.</div>';
            }
        }

        function checkAndNotifyNewQuake(title, mag, time) {
            const notifEnabled = localStorage.getItem('notif_enabled') === 'true';
            const minMag = parseFloat(localStorage.getItem('min_mag') || '3.0');
            const userRegion = localStorage.getItem('user_region') || 'Tümü';
            let regionMatch = (userRegion === 'Tümü') || title.toLowerCase().includes(userRegion.toLowerCase());
            if (notifEnabled && mag >= minMag && regionMatch) {
                alertAudio.currentTime = 0;
                alertAudio.play().catch(e => console.log('Ses hatası:', e));
                if ('Notification' in window && Notification.permission === 'granted') {
                    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                        navigator.serviceWorker.ready.then(reg => {
                            reg.showNotification('Yeni Deprem!', { body: `${title}\nBüyüklük: ${mag}\nSaat: ${time}`, icon: 'Dprmauresim.png' });
                        });
                    } else {
                        new Notification('Yeni Deprem!', { body: `${title}\nBüyüklük: ${mag}\nSaat: ${time}`, icon: 'Dprmauresim.png' });
                    }
                }
            }
        }

        function triggerTestNotification() {
            alertAudio.currentTime = 0;
            alertAudio.play().catch(e => console.log('Ses hatası:', e));
            if ('Notification' in window && Notification.permission === 'granted') {
                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification('Test Depremi', { body: 'Marmara Bölgesi - Test\nBüyüklük: 4.5\nSaat: 20:00:00', icon: 'Dprmauresim.png' });
                    });
                } else {
                    new Notification('Test Depremi', { body: 'Marmara Bölgesi - Test\nBüyüklük: 4.5\nSaat: 20:00:00', icon: 'Dprmauresim.png' });
                }
            } else {
                alert('Önce bildirim izni vermelisin!');
            }
        }
    </script>
</body>
</html>
