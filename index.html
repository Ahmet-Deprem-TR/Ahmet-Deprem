<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmet Deprem</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Firebase SDK v9+ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "SENIN_API_KEY",
            authDomain: "SENIN_PROJECT_ID.firebaseapp.com",
            projectId: "SENIN_PROJECT_ID",
            storageBucket: "SENIN_PROJECT_ID.appspot.com",
            messagingSenderId: "SENIN_SENDER_ID",
            appId: "SENIN_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        window.requestNotificationPermission = async function() {
            if (!('Notification' in window)) {
                return alert('Tarayıcınız bildirimleri desteklemiyor.');
            }

            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    document.getElementById('notifToggle').checked = true;
                    saveSettings();

                    const currentToken = await getToken(messaging, { 
                        vapidKey: 'SENIN_VAPID_KEY_BURAYA' 
                    });

                    if (currentToken) {
                        console.log('FCM Token:', currentToken);
                        alert('Bildirim izni verildi ve Firebase bağlandı!');
                    }
                } else {
                    document.getElementById('notifToggle').checked = false;
                    saveSettings();
                    alert('Bildirim izni reddedildi.');
                }
            } catch (err) {
                console.log('Bildirim izni hatası:', err);
            }
        };

        onMessage(messaging, (payload) => {
            console.log('Canlı Bildirim Geldi:', payload);
            const alertAudio = new Audio('dprauses.ogg');
            alertAudio.play().catch(e => console.log('Ses hatası:', e));
            
            const notification = new Notification(payload.notification.title, {
                body: payload.notification.body,
                icon: 'Dprmauresim.png'
            });

            notification.onclick = function(event) {
                event.preventDefault();
                window.focus();
                window.location.href = '/'; // Bildirime tıklandığında site açılır
            };
        });
    </script>

    <style>
        :root {
            --bg-color: #f1f5f9; 
            --text-color: #111827; 
            --card-bg: #ffffff;
            --accent-red: #dc2626; 
            --border-color: #cbd5e1; 
            --input-bg: #ffffff;
            --latest-border: #fef08a;
        }
        body.dark-theme {
            --bg-color: #121212; 
            --text-color: #e5e7eb; 
            --card-bg: #1e1e1e;
            --border-color: #333333; 
            --input-bg: #2a2a2a; 
            --latest-border: #fef08a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; border-radius: 0 !important; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; transition: background 0.2s, color 0.2s; }
        header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .logo-img { height: 30px; object-fit: contain; display: block; }
        .top-controls { display: flex; gap: 5px; }
        .top-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 10px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px; }
        .card h3 { font-size: 1rem; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .quake-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 5px; max-height: 400px; overflow-y: auto; }
        .quake-item { background: var(--input-bg); padding: 10px; font-size: 0.75rem; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 3px; }
        .settings-panel { display: flex; flex-direction: column; gap: 8px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; }
        .setting-row input, .setting-row select { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 4px 8px; font-size: 0.8rem; outline: none; }
        .test-btn { width: 100%; background: var(--accent-red); color: white; border: 1px solid #991b1b; padding: 10px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <img src="Ahmetlogo.png" alt="Ahmet Deprem" class="logo-img" id="logoImg">
        <div class="top-controls">
            <button class="top-btn" onclick="openLocationModal()">Bölge Seç</button>
            <button class="top-btn" onclick="requestNotificationPermission()">Bildirim İzni</button>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h3>Son Depremler (Tüm Detaylar)</h3>
            <div class="quake-list" id="quakeList">
                <div class="quake-item">
                    <div style="font-weight: bold;">Veriler yükleniyor...</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Ayarlar</h3>
            <div class="settings-panel">
                <div class="setting-row">
                    <span>Bildirimler</span>
                    <input type="checkbox" id="notifToggle" onchange="saveSettings()" style="width: 18px; height: 18px; cursor: pointer;">
                </div>
                <div class="setting-row">
                    <span>Minimum Şiddet</span>
                    <input type="number" id="minMagnitude" value="3.0" step="0.1" min="0" max="10" onchange="saveSettings()" style="width: 60px; text-align: center;">
                </div>
                <div class="setting-row">
                    <span>Tema (Koyu Gri)</span>
                    <input type="checkbox" id="darkThemeToggle" onchange="toggleTheme()" style="width: 18px; height: 18px; cursor: pointer;">
                </div>
            </div>
        </div>

        <button class="test-btn" onclick="triggerTestNotification()">TEST UYARISI</button>
    </div>

    <script>
        const alertAudio = new Audio('dprauses.ogg');

        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            fetchEarthquakes();
            setInterval(fetchEarthquakes, 300000);
        });

        function toggleTheme() {
            const isDark = document.getElementById('darkThemeToggle').checked;
            document.body.classList.toggle('dark-theme', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('logoImg').src = isDark ? 'Ahmetlogosiyah.png' : 'Ahmetlogo.png';
        }

        function saveSettings() {
            localStorage.setItem('notif_enabled', document.getElementById('notifToggle').checked);
            localStorage.setItem('min_mag', document.getElementById('minMagnitude').value);
        }

        function loadSettings() {
            const isDark = localStorage.getItem('theme') === 'dark';
            if (isDark) {
                document.body.classList.add('dark-theme');
                document.getElementById('darkThemeToggle').checked = true;
                document.getElementById('logoImg').src = 'Ahmetlogosiyah.png';
            }
            const hasPermission = ('Notification' in window && Notification.permission === 'granted');
            document.getElementById('notifToggle').checked = hasPermission;
        }

        async function fetchEarthquakes() {
            try {
                const response = await fetch('https://api.orhanaydogdu.com.tr/deprem/afad/live');
                const data = await response.json();
                if (data && data.result) {
                    const quakeListEl = document.getElementById('quakeList');
                    quakeListEl.innerHTML = '';
                    data.result.forEach((eq, index) => {
                        const title = eq.title || eq.location || '-';
                        const mag = eq.mag ?? eq.magnitude ?? '-';
                        const depth = eq.depth ? `${eq.depth} km` : 'Bilgi Alınamadı';
                        const timeOnly = eq.date ? eq.date.split('T')[1]?.substring(0, 8) || eq.date : '-';

                        const item = document.createElement('div');
                        item.className = 'quake-item';
                        item.innerHTML = `
                            <div style="font-weight: bold;">${title}</div>
                            <div><strong>Büyüklük:</strong> ${mag}</div>
                            <div><strong>Derinlik:</strong> ${depth}</div>
                            <div><strong>Zaman:</strong> ${timeOnly}</div>
                        `;
                        quakeListEl.appendChild(item);
                    });
                }
            } catch (error) {
                console.log('Hata:', error);
            }
        }

        function triggerTestNotification() {
            alertAudio.play().catch(e => {});
            new Notification('Az Önceki Deprem', { 
                body: 'Büyüklük: 4.5\nDerinlik: 7.2 km\nZaman: 20:00:00', 
                icon: 'Dprmauresim.png' 
            });
        }
    </script>
</body>
</html>
